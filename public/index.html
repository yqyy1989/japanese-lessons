<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>漫画日语课</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one manga page per day. Ink-bordered panels on dotted screentone paper;
     the teacher's red pen marks what is done and what is right. Single light theme by choice. */
  --paper:#eceef5;
  --sheet:#ffffff;
  --ink:#16151c;
  --ink-soft:#57566b;
  --tone:#c6c9d9;
  --red:#e23b2e;
  --hi:#ffe14d;
  --font-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --font-kana:"Klee One","YuKyokasho","Yu Kyokasho","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;
  background-color:var(--paper);
  background-image:radial-gradient(var(--tone) 1px,transparent 1.5px);
  background-size:13px 13px;
}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.ja{font-family:var(--font-kana);font-weight:600}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:2.5px solid var(--ink)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.1}
.brand-jp{font-size:12px;letter-spacing:.18em;color:var(--red)}
.brand-zh{font-family:var(--font-display);font-size:24px}
.nav{display:flex;gap:8px}
.nav a{text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--sheet)}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}

main{max-width:860px;margin:0 auto;padding:24px 16px 96px}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* ---------- panels ---------- */
.panel{background:var(--sheet);border:2.5px solid var(--ink);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.panel.pop{box-shadow:6px 6px 0 var(--ink)}
.tab{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;padding:2px 12px;border-radius:2px}
.tab.hi{background:var(--hi);color:var(--ink);border:2px solid var(--ink)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:1px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--sheet);white-space:nowrap}
.chip.kind-new{background:var(--hi)}
.chip.kind-manga{background:var(--red);color:#fff}
.chip.kind-class,.chip.kind-check{background:var(--ink);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;font-weight:500}
.sub{font-size:17px;color:var(--ink-soft);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;text-decoration:none;cursor:pointer;
  border:2.5px solid var(--ink);background:var(--sheet);padding:9px 16px;border-radius:3px;box-shadow:3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--red);color:#fff}
.btn.hi{background:var(--hi)}
.btn.sm{padding:5px 11px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn.on{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn.say{display:none;width:38px;height:38px;padding:0;border-radius:50%;flex:none}
.has-voice .btn.say{display:inline-flex}
.say svg{width:18px;height:18px}

/* ---------- home ---------- */
.hero{position:relative;padding:24px}
.hero h1{max-width:16em}
.stamp{flex:none;transform:rotate(-9deg)}
.stamp-wrap{display:flex;align-items:center;gap:10px;color:var(--red);font-family:var(--font-display);font-size:18px}
.hero .stamp-wrap{position:absolute;right:18px;top:14px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.cell{aspect-ratio:1/1;border:2px solid var(--ink);border-radius:2px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.cell.none{border-style:dashed;border-color:var(--tone);color:var(--tone)}
.cell.done{background:var(--red);color:#fff}
.cell.today{box-shadow:0 0 0 3px var(--hi)}
.big-num{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--red)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 4px;border-top:2px dashed var(--tone);text-decoration:none}
.item:first-child{border-top:0}
.item:hover .item-title{text-decoration:underline}
.item-day{font-family:var(--font-display);font-size:20px;min-width:3.2em}
.item-title{font-weight:700}
.item-end{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:14px}

/* ---------- lesson ---------- */
.bubble{position:relative;background:var(--sheet);border:2.5px solid var(--ink);border-radius:22px;padding:16px 20px;margin-left:8px;max-width:64ch}
.bubble::before{content:"";position:absolute;left:28px;bottom:-14px;width:22px;height:22px;background:var(--sheet);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(12deg,12deg)}
.who{position:absolute;top:-13px;left:18px;background:var(--red);color:#fff;font-size:13px;padding:0 10px;border-radius:999px;border:2px solid var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding-top:12px;border-top:2px dashed var(--tone)}
.step:first-child{border-top:0;padding-top:0}
.step input{width:24px;height:24px;margin:3px 0 0;accent-color:var(--red)}
.step-title{font-weight:700;font-size:17px}
.step.done .step-title{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.step-body{display:flex;flex-direction:column;gap:8px}

.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kana-card{border:2.5px solid var(--ink);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.kana-top{display:flex;align-items:center;gap:12px}
.glyph{font-size:64px;line-height:1}
.romaji{font-size:24px;font-weight:700;letter-spacing:.04em}
.writer{width:172px;height:172px;align-self:center;border:2px solid var(--ink);border-radius:2px;touch-action:none;
  background:
    linear-gradient(var(--tone),var(--tone)) 50% 0/1px 100% no-repeat,
    linear-gradient(var(--tone),var(--tone)) 0 50%/100% 1px no-repeat,var(--sheet)}
.writer svg{display:block;touch-action:none}
.writer.plain{display:flex;align-items:center;justify-content:center;font-size:96px}
.note b{display:inline-block;font-size:12px;background:var(--hi);border:1.5px solid var(--ink);border-radius:2px;padding:0 6px;margin-right:6px;font-weight:700}
.trace-ok{color:var(--red);font-weight:700;font-size:14px;min-height:1.4em}

.word{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:10px 0;border-top:2px dashed var(--tone)}
.word:first-child{border-top:0}
.word-jp{font-size:28px;line-height:1.2}
.word-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.word-ro{font-weight:700;color:var(--red)}

.pad-wrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pad{position:relative;width:min(100%,440px);aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:2px;background:var(--sheet)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad-draw{touch-action:none;cursor:crosshair}
.swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}

.linkrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--tone);text-decoration:none}
.linkrow:first-child{border-top:0}
.linkrow:hover .item-title{text-decoration:underline}
.linkrow svg{flex:none;width:20px;height:20px;margin-top:3px}

.q{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:2px dashed var(--tone)}
.q:first-of-type{border-top:0;padding-top:0}
.q-text{font-weight:700;font-size:17px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{font-size:17px;min-height:48px}
.opt.kana{font-size:30px}
.opt.right{background:var(--sheet);box-shadow:none;border-color:var(--red);color:var(--red)}
.opt.wrong{background:var(--paper);box-shadow:none;color:var(--ink-soft);text-decoration:line-through}
.verdict{font-weight:700}
.verdict .mark{display:inline-block;font-size:22px;color:var(--red);margin-right:6px;font-family:var(--font-kana)}
.score{font-family:var(--font-display);font-size:22px}

.parent{background:var(--hi)}
.done-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.yoku{font-size:22px;color:var(--red)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- review ---------- */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.kcell{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border:2px solid var(--ink);border-radius:3px;background:var(--sheet);cursor:pointer}
.kcell .ja{font-size:30px;line-height:1.2}
.kcell .ro{font-size:13px;font-weight:700;color:var(--red);min-height:1.5em}
.hide-ro .kcell:not(.shown) .ro{visibility:hidden}
.flash{align-self:center;width:min(100%,320px);aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:3px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--sheet)}
.flash .ja{font-size:150px;line-height:1}
.flash .ro{font-size:28px;font-weight:700;color:var(--red);min-height:1.5em}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.flash.sm{width:176px;box-shadow:4px 4px 0 var(--ink)}
.flash.sm .ja{font-size:96px}
.flash.sm .ro{font-size:22px}
.drill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.drill-card{border:2.5px solid var(--ink);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.drill-card .row{justify-content:center}
.drill-say{font-weight:700;min-height:1.6em;text-align:center}

/* ---------- timer + footer ---------- */
.timerbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:var(--hi);border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);padding:6px 8px 6px 18px;display:flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums;max-width:calc(100% - 32px)}
.timerbar[hidden]{display:none}
.foot{max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--ink-soft)}
@keyframes stampin{from{transform:rotate(-9deg) scale(1.6);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.stamp.fresh{animation:stampin .28s ease-out}
@media (max-width:520px){
  .panel{padding:16px}
  .hero .stamp-wrap{position:static}
  .strip{grid-template-columns:repeat(7,1fr)}
  .item{grid-template-columns:auto 1fr}
  .item-end{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home">
      <span class="brand-jp ja" lang="ja">まいにち にほんご</span>
      <span class="brand-zh">漫画日语课</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#home" data-nav="home">今天</a>
      <a href="#all" data-nav="all">全部课程</a>
      <a href="#review" data-nav="review">复习</a>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"><p class="muted">正在翻开课本…</p></main>

<div class="timerbar" id="timerbar" hidden role="status">
  <span id="timerlabel"></span>
  <button class="btn sm" id="timerstop" type="button">结束计时</button>
</div>

<footer class="foot">
  <p>笔顺数据来自 AnimCJK（Arphic Public License），笔顺动画使用 Hanzi Writer（MIT）。画板里的画只保存在这台设备上。</p>
</footer>

<script src="vendor/hanzi-writer.min.js"></script>
<script>
(function () {
  'use strict';

  var TZ = 'America/Vancouver';
  var INK = '#16151c', RED = '#e23b2e', TONE = '#c6c9d9';
  var app = document.getElementById('app');
  var KIND = { 'new': '新内容', manga: '漫画日', light: '轻松日', 'class': '上课日', check: '过关检查' };

  /* ---------- small helpers ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'on') Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function ja(text, cls, tag) {
    return h(tag || 'span', { 'class': 'ja' + (cls ? ' ' + cls : ''), lang: 'ja', text: text });
  }
  function svg(markup, cls) {
    var s = document.createElement('span');
    s.innerHTML = markup; /* static markup written in this file only */
    var n = s.firstChild;
    if (cls) n.setAttribute('class', cls);
    return n;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dparts(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
  function addDays(s, n) { var p = dparts(s); return new Date(Date.UTC(p.y, p.m - 1, p.d + n)).toISOString().slice(0, 10); }
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function weekday(s) { var p = dparts(s); return WD[new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay()]; }
  function niceDate(s) { var p = dparts(s); return p.m + '月' + p.d + '日'; }
  function todayStr() {
    try {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
      if (o.year && o.month && o.day) return o.year + '-' + o.month + '-' + o.day;
    } catch (e) {}
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function clock(sec) { sec = Math.max(0, Math.round(sec)); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
  function chars(s) { return Array.from(String(s || '')); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function cap(name) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        return Promise.resolve(window.claude.use(name)).catch(function () { return null; });
      }
    } catch (e) {}
    return Promise.resolve(null);
  }
  function currentRoute() { return (location.hash || '').replace(/^#/, '') || 'home'; }

  var ICON_SAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 8.5a5 5 0 0 1 0 7"/><path d="M19.8 5.5a9 9 0 0 1 0 13"/></svg>';
  var ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

  /* hanamaru: the flower-circle a Japanese teacher draws on good work */
  function hanamaru(size, fresh) {
    var pts = [], i, a, r;
    for (i = 0; i <= 150; i++) { a = i / 150 * Math.PI * 2 * 2.6 - Math.PI / 2; r = 2 + i / 150 * 19; pts.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1)); }
    var petals = '', n = 8;
    for (i = 0; i < n; i++) {
      var a0 = i / n * Math.PI * 2 - 1.2, a1 = (i + 1) / n * Math.PI * 2 - 1.2;
      var x0 = 50 + 26 * Math.cos(a0), y0 = 50 + 26 * Math.sin(a0), x1 = 50 + 26 * Math.cos(a1), y1 = 50 + 26 * Math.sin(a1);
      petals += (i === 0 ? 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) : '') + ' A12,12 0 1 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1);
    }
    var m = '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '" fill="none" stroke="' + RED + '" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="完成"><polyline points="' + pts.join(' ') + '"/><path d="' + petals + '"/></svg>';
    return svg(m, 'stamp' + (fresh ? ' fresh' : ''));
  }

  /* ---------- voice: device Japanese voice first, Claude voice as backup ---------- */
  var Voice = (function () {
    var synth = null; try { synth = window.speechSynthesis || null; } catch (e) {}
    var nativeVoice = null, claudeTts = null;
    function available() { return !!(nativeVoice || claudeTts); }
    function notify() { document.documentElement.classList.toggle('has-voice', available()); }
    function pick() {
      if (!synth) return;
      try {
        var vs = (synth.getVoices() || []).filter(function (v) { return /^ja([-_]|$)/i.test(v.lang || ''); });
        nativeVoice = vs.filter(function (v) { return v.localService; })[0] || vs[0] || null;
      } catch (e) { nativeVoice = null; }
      notify();
    }
    if (synth) {
      pick();
      try { synth.addEventListener('voiceschanged', pick); } catch (e) { try { synth.onvoiceschanged = pick; } catch (e2) {} }
    }
    cap('tts').then(function (t) { claudeTts = t || null; notify(); });
    function viaClaude(text) {
      if (!claudeTts) return;
      try {
        Promise.resolve(claudeTts.speak(text, { language: 'ja', rate: 0.85 })).catch(function (e) {
          if (e && e.code === 'not_granted') { claudeTts = null; notify(); }
        });
      } catch (e) {}
    }
    function speak(text) {
      if (!text) return;
      if (nativeVoice && synth) {
        try {
          synth.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.voice = nativeVoice; u.lang = nativeVoice.lang || 'ja-JP'; u.rate = 0.8;
          var started = false, settled = false;
          u.onstart = function () { started = true; };
          u.onend = function () { settled = true; };
          u.onerror = function (ev) {
            var code = ev && ev.error;
            if (started || settled || code === 'interrupted' || code === 'canceled') return;
            settled = true;
            if (claudeTts) { nativeVoice = null; notify(); viaClaude(text); }
          };
          synth.speak(u);
          setTimeout(function () {
            if (started || settled || !claudeTts) return;

  function drillPanel(pool, date) {
    pool = (pool || []).filter(function (k) { return k && k.char; });
    var single = pool.filter(function (k) { return chars(k.char).length === 1; });
    var sec = h('section', { 'class': 'panel', id: 'sec-drill' }, h('span', { 'class': 'tab hi', text: '抽假名和听写' }));
    var grid = h('div', { 'class': 'drill-grid' }); sec.appendChild(grid);
    function other(list, not) { var k; do { k = list[Math.floor(Math.random() * list.length)]; } while (list.length > 1 && k === not); return k; }
    function tally(kind, ok) {
      if (!date) return;
      var d = Object.assign({}, Store.get(date).drill || {});
      var t = Object.assign({ right: 0, total: 0 }, d[kind] || {});
      t.total++; if (ok) t.right++; d[kind] = t;
      Store.patch(date, { drill: d }, true);
    }

    /* 1. random pick: the kana flicker until she presses stop, then she reads the one it lands on */
    (function () {
      var glyph = ja('？'), ro = h('span', { 'class': 'ro' });
      var info = h('p', { 'class': 'drill-say', 'aria-live': 'polite' });
      var go = h('button', { 'class': 'btn primary', type: 'button', text: '开始' });
      var reveal = h('button', { 'class': 'btn sm', type: 'button', text: '看读音', hidden: true });
      var yes = h('button', { 'class': 'btn sm hi', type: 'button', text: '○ 读对了', hidden: true });
      var no = h('button', { 'class': 'btn sm', type: 'button', text: '× 没读对', hidden: true });
      var tm = null, cur = null, last = null, t0 = 0, right = 0, total = 0;
      function halt() { clearInterval(tm); tm = null; }
      disposers.push(halt);
      go.addEventListener('click', function () {
        if (tm) {
          halt();
          cur = last = other(pool, last);
          glyph.textContent = cur.char; t0 = Date.now();
          go.textContent = '开始'; go.disabled = true; reveal.hidden = false;
          info.textContent = '马上读出来！';
          return;
        }
        ro.textContent = ''; reveal.hidden = true; yes.hidden = true; no.hidden = true; info.textContent = '';
        go.textContent = '停！';
        tm = setInterval(function () { cur = other(pool, cur); glyph.textContent = cur.char; }, 80);
      });
      reveal.addEventListener('click', function () {
        if (!cur) return;
        ro.textContent = cur.romaji || ''; Voice.speak(cur.say || cur.char);
        info.textContent = '用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒';
        reveal.hidden = true; yes.hidden = false; no.hidden = false; go.disabled = false; go.textContent = '再抽一个';
      });
      function judge(ok) {
        total++; if (ok) right++; tally('spin', ok);
        info.textContent = '读对 ' + right + ' / ' + total;
        yes.hidden = true; no.hidden = true;
      }
      yes.addEventListener('click', function () { judge(true); });
      no.addEventListener('click', function () { judge(false); });
      grid.appendChild(h('div', { 'class': 'drill-card' },
        h('h3', { text: '抽假名' }),
        h('p', { 'class': 'muted small', text: '按“开始”，假名会飞快地跳；按“停！”抽中一个，马上大声读出来，再看读音对不对。' }),
        h('div', { 'class': 'flash sm' }, glyph, ro), info,
        h('div', { 'class': 'row' }, go, reveal, yes, no)));
    })();

    /* 2. dictation: she hears a kana and writes it from memory; strokes are checked when stroke data exists */
    if (single.length) (function () {
      var say = h('p', { 'class': 'drill-say', 'aria-live': 'polite', text: '按“听一个”开始。' });
      var pad = h('div', { 'class': 'writer' });
      var result = h('p', { 'class': 'verdict', 'aria-live': 'polite' });
      var next = h('button', { 'class': 'btn primary', type: 'button', text: '听一个' });
      var again = h('button', { 'class': 'btn sm', type: 'button', text: '再听一遍', hidden: true });
      var show = h('button', { 'class': 'btn sm', type: 'button', text: '看答案', hidden: true });
      var cur = null, last = null, writer = null, done = true, right = 0, total = 0;
      function play() {
        if (!cur) return;
        if (Voice.ready()) { Voice.speak(cur.say || cur.char); say.textContent = writer ? '听到了吗？在格子里按笔顺写出来。' : '听到了吗？写在纸上，再看答案。'; }
        else say.textContent = '这台设备播不出日语语音，看读音写：' + (cur.romaji || '');
      }
      function finish(ok) {
        if (done || !cur) return;
        done = true; total++; if (ok) right++; tally('dict', ok);
        if (!ok) {
          if (writer) { try { writer.cancelQuiz(); writer.showCharacter(); } catch (e) {} }
          else { pad.className = 'writer plain ja'; pad.lang = 'ja'; pad.textContent = cur.char; }
        }
        result.textContent = '';
        result.appendChild(h('span', { 'class': 'mark', text: ok ? '○' : '×' }));
        result.appendChild(document.createTextNode((ok ? '写对了：' : '答案是：') + cur.char + '（' + (cur.romaji || '') + '）　写对 ' + right + ' / ' + total));
        show.hidden = true;
      }
      next.addEventListener('click', function () {
        cur = last = other(single, last); done = false;
        result.textContent = ''; pad.textContent = ''; pad.className = 'writer'; pad.removeAttribute('lang'); writer = null;
        if (window.HanziWriter && Data.strokes && Data.strokes[cur.char]) {
          try {
            writer = window.HanziWriter.create(pad, cur.char, {
              width: 168, height: 168, padding: 12, showOutline: false, showCharacter: false,
              strokeColor: INK, drawingColor: INK, highlightColor: RED, drawingWidth: 6,
              showHintAfterMisses: false, highlightOnComplete: true,

            });
            writer.quiz({ onComplete: function () { finish(true); } });
          } catch (e) { writer = null; }
        }
        next.textContent = '下一个'; again.hidden = false; show.hidden = false;
        play();
      });
      again.addEventListener('click', play);
      show.addEventListener('click', function () { finish(false); });
      grid.appendChild(h('div', { 'class': 'drill-card' },
        h('h3', { text: '听写' }),
        h('p', { 'class': 'muted small', text: '听一个读音，不看字，把听到的假名写出来。笔顺和形状对了会自动判对；想不起来就按“看答案”。' }),
        say, pad, result,
        h('div', { 'class': 'row' }, next, again, show)));
    })();
    return sec;
  }

  function quizSection(lesson, date) {

    function run() {
      body.textContent = '';

      var total = h('p', { 'class': 'score', 'aria-live': 'polite' });

        var block = h('div', { 'class': 'q' });
        block.appendChild(h('div', { 'class': 'row' }, h('span', { 'class': 'q-text', text: (qi + 1) + '. ' + q.q }), q.say ? sayBtn(q.say, '听题目里的发音') : null));
        var verdict = h('p', { 'class': 'verdict', 'aria-live': 'polite' });
        var isKana = q.options.every(function (o) { return chars(o).length <= 3 && /^[぀-ヿー]+$/.test(o); });
        var btns = q.options.map(function (o, oi) {
          var b = h('button', { 'class': 'btn opt' + (isKana ? ' kana ja' : ''), type: 'button', text: String(o) });

            var ok = oi === q.answer;

            if (!ok) b.classList.add('wrong');
            verdict.textContent = '';
            verdict.appendChild(h('span', { 'class': 'mark', text: ok ? '○' : '×' }));
            verdict.appendChild(document.createTextNode((ok ? '答对了。' : '再记一下。') + (q.explain ? ' ' + q.explain : '')));
            answered++; if (ok) score++; else wrong.push(q.q);
            if (answered === qs.length) {
              total.textContent = '得分 ' + score + ' / ' + qs.length + (score === qs.length ? '　全对！' : '');
              Store.patch(date, { quiz: { score: score, total: qs.length, wrong: wrong, at: new Date().toISOString() } }, true);

        block.appendChild(h('div', { 'class': 'opts' }, btns));

          h('div', { 'class': 'row spread' }, h('span', { 'class': 'tab', text: '学过的 ' + kana.length + ' 个假名' }), toggle),
          h('p', { 'class': 'muted small', text: '先自己读，再点一下核对读音。' }), grid));

        var checkSec = h('section', { 'class': 'panel pop', id: 'sec-check' }, h('span', { 'class': 'tab hi', text: '打乱抽查' }));
        var stage = h('div', { 'class': 'stack' }); checkSec.appendChild(stage);
        var single = kana.filter(function (k) { return chars(k.char).length === 1; });
        var startScreen = function () {
          clearInterval(reviewTimer); stage.textContent = '';
          stage.appendChild(h('p', { text: '一张一张随机出，孩子读，家长按“读对了”或“没读对”。过关目标：46 个基本假名两分钟内全对。' }));
          var go = h('button', { 'class': 'btn primary', type: 'button', text: '开始抽查（' + single.length + ' 张）' });
          go.addEventListener('click', function () { runCheck(single); });

        var runCheck = function (deck) {
          var order = shuffle(deck), i = 0, right = 0, missed = [], t0 = Date.now();
          var count = h('span', { 'class': 'clock' }), time = h('span', { 'class': 'clock' });
          var glyph = ja('', null), ro = h('span', { 'class': 'ro' });
          var reveal = h('button', { 'class': 'btn', type: 'button', text: '看读音' });
          var yes = h('button', { 'class': 'btn primary', type: 'button', text: '○ 读对了' });

          function show() {

            clearInterval(reviewTimer);
            var secs = Math.round((Date.now() - t0) / 1000);
            Store.saveCheck({ id: today + '-' + pad2(new Date().getHours()) + pad2(new Date().getMinutes()) + pad2(new Date().getSeconds()), date: today, total: order.length, right: right, seconds: secs, missed: missed.map(function (k) { return k.char; }), at: new Date().toISOString() });
            stage.textContent = '';
            stage.appendChild(h('p', { 'class': 'score', text: order.length + ' 张里读对 ' + right + ' 张，用时 ' + clock(secs) }));
            if (missed.length) {
              stage.appendChild(h('p', {}, '没读对的：', ja(missed.map(function (k) { return k.char; }).join('　'))));
              var redo = h('button', { 'class': 'btn hi', type: 'button', text: '只练没读对的' });
              redo.addEventListener('click', function () { runCheck(missed); });
              stage.appendChild(h('div', { 'class': 'row' }, redo));
            } else stage.appendChild(h('div', { 'class': 'stamp-wrap' }, hanamaru(72, true), ja('よくできました！')));
            var back = h('button', { 'class': 'btn sm', type: 'button', text: '重新开始' });
            back.addEventListener('click', startScreen);
            stage.appendChild(h('div', { 'class': 'row' }, back));
          }
          reveal.addEventListener('click', function () { var k = order[i]; ro.textContent = k.romaji || ''; Voice.speak(k.say || k.char); });
          yes.addEventListener('click', function () { step(true); });
          no.addEventListener('click', function () { step(false); });
          stage.textContent = '';
          stage.appendChild(h('div', { 'class': 'row spread' }, count, time));
          stage.appendChild(h('div', { 'class': 'flash' }, glyph, ro));
          stage.appendChild(h('div', { 'class': 'row', style: 'justify-content:center' }, reveal, yes, no));
          clearInterval(reviewTimer);
          reviewTimer = setInterval(function () { time.textContent = clock((Date.now() - t0) / 1000); }, 500);
          time.textContent = '00:00'; show();
        };
        startScreen();
        holder.appendChild(checkSec);
        holder.appendChild(drillPanel(kana, null));
      }

      if (words.length) {
        var box = h('div', {}); words.forEach(function (w) { box.appendChild(wordRow(w)); });
        holder.appendChild(h('section', { 'class': 'panel' }, h('span', { 'class': 'tab', text: '单词本（' + words.length + '）' }), box));
      }
    });
  }

  /* ---------- router ---------- */
  var offStore = null, disposers = [];
  function setNav(name) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
      if (a.getAttribute('data-nav') === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function render() {
    clearInterval(reviewTimer);
    disposers.forEach(function (f) { try { f(); } catch (e) {} }); disposers = [];
    if (offStore) { offStore(); offStore = null; }
    var name = currentRoute(), m = /^d-(\d{4}-\d{2}-\d{2})$/.exec(name);
    app.textContent = '';
    if (m) { setNav(''); viewLesson(m[1]); }
    else if (name === 'all') { setNav('all'); viewAll(); offStore = Store.onChange(render); }
    else if (name === 'review') { setNav('review'); viewReview(); }
    else { setNav('home'); viewHome(); offStore = Store.onChange(render); }
  }
  function route() {
    var name = currentRoute();
    var isList = !/^d-/.test(name) && name !== 'review';
    if (isList && Date.now() - Data.loadedAt > 120000) {
      loadManifest().catch(function () {}).then(function () { render(); window.scrollTo(0, 0); });
      return;
    }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  loadManifest().then(route).catch(function () {
    app.textContent = '';
    var retry = h('button', { 'class': 'btn', type: 'button', text: '重新加载' });
    retry.addEventListener('click', function () { loadManifest().then(route).catch(function () {}); });
    app.appendChild(h('section', { 'class': 'panel' }, h('h2', { text: '课程目录没有加载出来' }), h('p', { 'class': 'muted', text: '检查一下网络，然后再试一次。' }), h('div', { 'class': 'row' }, retry)));
  });
})();
</script>
</body>
</html>
