<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>漫画日语课</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one manga page per day. Ink-bordered panels on dotted screentone paper;
     the teacher's red pen marks what is done and what is right. Single light theme by choice. */
  --paper:#eceef5;
  --sheet:#ffffff;
  --ink:#16151c;
  --ink-soft:#57566b;
  --tone:#c6c9d9;
  --red:#e23b2e;
  --hi:#ffe14d;
  --font-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --font-kana:"Klee One","YuKyokasho","Yu Kyokasho","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;
  background-color:var(--paper);
  background-image:radial-gradient(var(--tone) 1px,transparent 1.5px);
  background-size:13px 13px;
}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.ja{font-family:var(--font-kana);font-weight:600}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:2.5px solid var(--ink)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.1}
.brand-jp{font-size:12px;letter-spacing:.18em;color:var(--red)}
.brand-zh{font-family:var(--font-display);font-size:24px}
.nav{display:flex;gap:8px}
.nav a{text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--sheet)}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}

main{max-width:860px;margin:0 auto;padding:24px 16px 96px}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* ---------- panels ---------- */
.panel{background:var(--sheet);border:2.5px solid var(--ink);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.panel.pop{box-shadow:6px 6px 0 var(--ink)}
.tab{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;font-family:var(--font-display);font-size:15px;letter-spacing:.06em;padding:2px 12px;border-radius:2px}
.tab.hi{background:var(--hi);color:var(--ink);border:2px solid var(--ink)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:1px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--sheet);white-space:nowrap}
.chip.kind-new{background:var(--hi)}
.chip.kind-manga{background:var(--red);color:#fff}
.chip.kind-class,.chip.kind-check{background:var(--ink);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;font-weight:500}
.sub{font-size:17px;color:var(--ink-soft);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;text-decoration:none;cursor:pointer;
  border:2.5px solid var(--ink);background:var(--sheet);padding:9px 16px;border-radius:3px;box-shadow:3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--red);color:#fff}
.btn.hi{background:var(--hi)}
.btn.sm{padding:5px 11px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn.on{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn.say{display:none;width:38px;height:38px;padding:0;border-radius:50%;flex:none}
.has-voice .btn.say{display:inline-flex}
.say svg{width:18px;height:18px}

/* ---------- home ---------- */
.hero{position:relative;padding:24px}
.hero h1{max-width:16em}
.stamp{flex:none;transform:rotate(-9deg)}
.stamp-wrap{display:flex;align-items:center;gap:10px;color:var(--red);font-family:var(--font-display);font-size:18px}
.hero .stamp-wrap{position:absolute;right:18px;top:14px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.cell{aspect-ratio:1/1;border:2px solid var(--ink);border-radius:2px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.cell.none{border-style:dashed;border-color:var(--tone);color:var(--tone)}
.cell.done{background:var(--red);color:#fff}
.cell.today{box-shadow:0 0 0 3px var(--hi)}
.big-num{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--red)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 4px;border-top:2px dashed var(--tone);text-decoration:none}
.item:first-child{border-top:0}
.item:hover .item-title{text-decoration:underline}
.item-day{font-family:var(--font-display);font-size:20px;min-width:3.2em}
.item-title{font-weight:700}
.item-end{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:14px}

/* ---------- lesson ---------- */
.bubble{position:relative;background:var(--sheet);border:2.5px solid var(--ink);border-radius:22px;padding:16px 20px;margin-left:8px;max-width:64ch}
.bubble::before{content:"";position:absolute;left:28px;bottom:-14px;width:22px;height:22px;background:var(--sheet);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg) skew(12deg,12deg)}
.who{position:absolute;top:-13px;left:18px;background:var(--red);color:#fff;font-size:13px;padding:0 10px;border-radius:999px;border:2px solid var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding-top:12px;border-top:2px dashed var(--tone)}
.step:first-child{border-top:0;padding-top:0}
.step input{width:24px;height:24px;margin:3px 0 0;accent-color:var(--red)}
.step-title{font-weight:700;font-size:17px}
.step.done .step-title{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.step-body{display:flex;flex-direction:column;gap:8px}

.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kana-card{border:2.5px solid var(--ink);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.kana-top{display:flex;align-items:center;gap:12px}
.glyph{font-size:64px;line-height:1;white-space:nowrap}
.glyph.two{font-size:46px}
.romaji{font-size:24px;font-weight:700;letter-spacing:.04em}
.writer{width:172px;height:172px;align-self:center;border:2px solid var(--ink);border-radius:2px;touch-action:none;
  background:
    linear-gradient(var(--tone),var(--tone)) 50% 0/1px 100% no-repeat,
    linear-gradient(var(--tone),var(--tone)) 0 50%/100% 1px no-repeat,var(--sheet)}
.writer svg{display:block;touch-action:none}
.writer.plain{display:flex;align-items:center;justify-content:center;font-size:96px}
.note b{display:inline-block;font-size:12px;background:var(--hi);border:1.5px solid var(--ink);border-radius:2px;padding:0 6px;margin-right:6px;font-weight:700}
.trace-ok{color:var(--red);font-weight:700;font-size:14px;min-height:1.4em}

.word{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:10px 0;border-top:2px dashed var(--tone)}
.word:first-child{border-top:0}
.word-jp{font-size:28px;line-height:1.2}
.word-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.word-ro{font-weight:700;color:var(--red)}

.pad-wrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pad{position:relative;width:min(100%,440px);aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:2px;background:var(--sheet)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad-draw{touch-action:none;cursor:crosshair}
.swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}

.linkrow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--tone);text-decoration:none}
.linkrow:first-child{border-top:0}
.linkrow:hover .item-title{text-decoration:underline}
.linkrow svg{flex:none;width:20px;height:20px;margin-top:3px}

.q{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:2px dashed var(--tone)}
.q:first-of-type{border-top:0;padding-top:0}
.q-text{font-weight:700;font-size:17px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{font-size:17px;min-height:48px}
.opt.kana{font-size:30px}
.opt.right{background:var(--sheet);box-shadow:none;border-color:var(--red);color:var(--red)}
.opt.wrong{background:var(--paper);box-shadow:none;color:var(--ink-soft);text-decoration:line-through}
.verdict{font-weight:700}
.verdict .mark{display:inline-block;font-size:22px;color:var(--red);margin-right:6px;font-family:var(--font-kana)}
.score{font-family:var(--font-display);font-size:22px}

.parent{background:var(--hi)}
.done-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.yoku{font-size:22px;color:var(--red)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- review ---------- */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.kcell{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border:2px solid var(--ink);border-radius:3px;background:var(--sheet);cursor:pointer}
.kcell .ja{font-size:30px;line-height:1.2;white-space:nowrap}
.kcell.two .ja{font-size:23px;line-height:1.57}
.kcell .ro{font-size:13px;font-weight:700;color:var(--red);min-height:1.5em}
.hide-ro .kcell:not(.shown) .ro{visibility:hidden}
.flash{align-self:center;width:min(100%,320px);aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:3px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--sheet)}
.flash .ja{font-size:150px;line-height:1}
.flash .ro{font-size:28px;font-weight:700;color:var(--red);min-height:1.5em}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.flash.sm{width:176px;box-shadow:4px 4px 0 var(--ink)}
.flash.sm .ja{font-size:96px}
.flash.sm .ro{font-size:22px}
.drill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.drill-card{border:2.5px solid var(--ink);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.drill-card .row{justify-content:center}
.drill-say{font-weight:700;min-height:1.6em;text-align:center}

/* ---------- kana test ---------- */
.pick{border-top:2px dashed var(--tone);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.pick-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pick-toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;background:none;border:0;padding:4px 0;cursor:pointer}
.pick-toggle::before{content:"";width:0;height:0;border-left:9px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent;transition:transform .1s}
.pick-toggle[aria-expanded="true"]::before{transform:rotate(90deg)}
.pick-count{font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pick-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 20px}
.pick-rows.three{grid-template-columns:repeat(auto-fill,minmax(244px,1fr))}
.pick-row{display:flex;gap:6px;align-items:center}
.krow{flex:none;width:50px;font-size:13px;font-weight:700;padding:4px 0;border:2px solid var(--ink);border-radius:999px;background:var(--sheet);cursor:pointer;white-space:nowrap}
.three .krow{width:60px}
.krow.on{background:var(--ink);color:#fff}
.kpick{flex:none;width:40px;height:40px;padding:0;font-size:23px;line-height:1;border:2px solid var(--ink);border-radius:3px;background:var(--sheet);cursor:pointer;display:flex;align-items:center;justify-content:center}
.kpick.two{width:54px;font-size:19px}
.kpick.on{background:var(--hi);box-shadow:inset 0 0 0 2px var(--ink)}
.kpick.gap{visibility:hidden}
.startbar{position:sticky;bottom:14px;z-index:10;display:flex;justify-content:center;pointer-events:none}
.startbar .btn{pointer-events:auto;font-size:18px;padding:12px 24px}
.test-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.center{justify-content:center}
.flash.two .ja{font-size:108px}
.wr-row{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.wr-row .writer{align-self:flex-end;flex:none}
.writer.small{width:124px;height:124px}
.writer.small.plain{font-size:64px}
.writer.idle{opacity:.4}
.keys{display:none}
@media (hover:hover) and (pointer:fine){.keys{display:block}}
.missed{font-size:30px;letter-spacing:.12em;line-height:1.5}

/* ---------- timer + footer ---------- */
.timerbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:var(--hi);border:2.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);padding:6px 8px 6px 18px;display:flex;align-items:center;gap:12px;font-weight:700;font-variant-numeric:tabular-nums;max-width:calc(100% - 32px)}
.timerbar[hidden]{display:none}
.foot{max-width:860px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--ink-soft)}
@keyframes stampin{from{transform:rotate(-9deg) scale(1.6);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.stamp.fresh{animation:stampin .28s ease-out}
@media (max-width:520px){
  .panel{padding:16px}
  .hero .stamp-wrap{position:static}
  .strip{grid-template-columns:repeat(7,1fr)}
  .item{grid-template-columns:auto 1fr}
  .item-end{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home">
      <span class="brand-jp ja" lang="ja">まいにち にほんご</span>
      <span class="brand-zh">漫画日语课</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#home" data-nav="home">今天</a>
      <a href="#all" data-nav="all">全部课程</a>
      <a href="#review" data-nav="review">复习</a>
      <a href="#test" data-nav="test">测试</a>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"><p class="muted">正在翻开课本…</p></main>

<div class="timerbar" id="timerbar" hidden role="status">
  <span id="timerlabel"></span>
  <button class="btn sm" id="timerstop" type="button">结束计时</button>
</div>

<footer class="foot">
  <p>笔顺数据来自 AnimCJK（Arphic Public License），笔顺动画使用 Hanzi Writer（MIT）。画板里的画只保存在这台设备上。</p>
  <p>假名的读音是真人录音（先女声，后男声），来自 Tae Kim's Guide to Learning Japanese（guidetojapanese.org），按 CC BY-NC-SA 许可使用，只做了剪短和音量调整。</p>
  <p>单词和句子的读音是合成语音：VOICEVOX:四国めたん。</p>
</footer>

<script src="vendor/hanzi-writer.min.js"></script>
<script>
(function () {
  'use strict';

  var TZ = 'America/Vancouver';
  var INK = '#16151c', RED = '#e23b2e', TONE = '#c6c9d9';
  var app = document.getElementById('app');
  var KIND = { 'new': '新内容', manga: '漫画日', light: '轻松日', 'class': '上课日', check: '过关检查' };

  /* ---------- small helpers ---------- */
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'on') Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function ja(text, cls, tag) {
    return h(tag || 'span', { 'class': 'ja' + (cls ? ' ' + cls : ''), lang: 'ja', text: text });
  }
  function svg(markup, cls) {
    var s = document.createElement('span');
    s.innerHTML = markup; /* static markup written in this file only */
    var n = s.firstChild;
    if (cls) n.setAttribute('class', cls);
    return n;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dparts(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
  function addDays(s, n) { var p = dparts(s); return new Date(Date.UTC(p.y, p.m - 1, p.d + n)).toISOString().slice(0, 10); }
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function weekday(s) { var p = dparts(s); return WD[new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay()]; }
  function niceDate(s) { var p = dparts(s); return p.m + '月' + p.d + '日'; }
  function todayStr() {
    try {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
      if (o.year && o.month && o.day) return o.year + '-' + o.month + '-' + o.day;
    } catch (e) {}
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function dayOf(iso) {
    try {
      var d = new Date(iso); if (isNaN(d.getTime())) return '';
      var o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
      return o.year + '-' + o.month + '-' + o.day;
    } catch (e) { return ''; }
  }
  function clock(sec) { sec = Math.max(0, Math.round(sec)); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
  function chars(s) { return Array.from(String(s || '')); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function cap(name) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        return Promise.resolve(window.claude.use(name)).catch(function () { return null; });
      }
    } catch (e) {}
    return Promise.resolve(null);
  }

  function sketchPad(storeKey, guideSpec) {
    var S = 600, key = storeKey, tool = 'ink', size = 7, drawing = false, last = null, undo = [], armed = false;
    var guide = h('canvas', { width: S, height: S, 'aria-hidden': 'true' });
    var cv = h('canvas', { width: S, height: S, 'class': 'pad-draw', role: 'img', 'aria-label': '画板' });
    var g = guide.getContext('2d'), ctx = cv.getContext('2d');
    function paintGuide(spec) {

      if (!spec) return;
      if (spec.layout === 'yonkoma') {
        g.strokeStyle = INK; g.lineWidth = 4; g.fillStyle = 'rgba(22,21,28,.45)'; g.font = '700 26px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'top';
        var order = [[1, 0], [0, 0], [1, 1], [0, 1]]; /* manga reads right to left */
        order.forEach(function (c, i) {
          var x = 14 + c[0] * 293, y = 14 + c[1] * 293;
          g.strokeRect(x, y, 279, 279); g.fillText(String(i + 1), x + 10, y + 8);
        });
        return;
      }
      if (spec.char) {
        var n = chars(spec.char).length;
        g.fillStyle = 'rgba(22,21,28,.11)'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = '600 ' + Math.floor(440 / Math.max(1, n * 0.85)) + 'px "Klee One","YuKyokasho","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",serif';
        g.fillText(spec.char, S / 2, S / 2 + 12);

    }
    function setGuide(spec) {
      paintGuide(spec);
      try { if (spec && spec.char && document.fonts && document.fonts.load) document.fonts.load('600 100px "Klee One"', spec.char).then(function () { paintGuide(spec); }).catch(function () {}); } catch (e) {}
    }
    function save() {
      try { localStorage.setItem('mnk.draw.' + key, cv.toDataURL('image/png')); }
      catch (e) {
        try {
          var olds = Object.keys(localStorage).filter(function (k) { return k.indexOf('mnk.draw.') === 0 && k !== 'mnk.draw.' + key; }).sort();
          olds.slice(0, 5).forEach(function (k) { localStorage.removeItem(k); });
          localStorage.setItem('mnk.draw.' + key, cv.toDataURL('image/png'));
        } catch (e2) {}
      }
    }
    function load() {
      ctx.clearRect(0, 0, S, S); undo = [];
      var data = null; try { data = localStorage.getItem('mnk.draw.' + key); } catch (e) {}
      if (!data) return;
      var img = new Image(); var k0 = key;
      img.onload = function () { if (k0 === key) ctx.drawImage(img, 0, 0, S, S); };
      img.src = data;
    }
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * S / r.width, y: (e.clientY - r.top) * S / r.height }; }
    function style(e) {

      var w = tool === 'erase' ? size * 4 : size;
      if (e && e.pointerType === 'pen' && e.pressure > 0) w *= 0.45 + e.pressure * 1.1;
      ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    cv.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      try { undo.push(ctx.getImageData(0, 0, S, S)); if (undo.length > 8) undo.shift(); } catch (x) {}
      drawing = true; last = pos(e); style(e);

    cv.addEventListener('pointermove', function (e) {
      if (!drawing) return;

      var p = pos(e); style(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    });
    ['pointerup', 'pointercancel'].forEach(function (n) {
      cv.addEventListener(n, function () { if (drawing) { drawing = false; ctx.globalCompositeOperation = 'source-over'; save(); } });
    });

    var tools = [['ink', '墨水', INK], ['red', '红笔', RED], ['erase', '橡皮', null]];
    var toolBtns = tools.map(function (t) {
      var b = h('button', { 'class': 'btn sm' + (t[0] === tool ? ' on' : ''), type: 'button', 'aria-pressed': t[0] === tool ? 'true' : 'false' },
        t[2] ? h('span', { 'class': 'swatch', style: 'background:' + t[2] }) : null, t[1]);
      b.addEventListener('click', function () {
        tool = t[0];
        toolBtns.forEach(function (x, i) { var on = tools[i][0] === tool; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
      });
      return b;
    });
    var sizes = [['细', 4], ['中', 7], ['粗', 13]];
    var sizeBtns = sizes.map(function (s) {
      var b = h('button', { 'class': 'btn sm' + (s[1] === size ? ' on' : ''), type: 'button', text: s[0], 'aria-pressed': s[1] === size ? 'true' : 'false' });
      b.addEventListener('click', function () {
        size = s[1];
        sizeBtns.forEach(function (x, i) { var on = sizes[i][1] === size; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
      });
      return b;
    });
    var undoBtn = h('button', { 'class': 'btn sm', type: 'button', text: '撤销' });
    undoBtn.addEventListener('click', function () { var im = undo.pop(); if (im) { ctx.putImageData(im, 0, 0); save(); } });
    var clearBtn = h('button', { 'class': 'btn sm', type: 'button', text: '清空' });
    clearBtn.addEventListener('click', function () {
      if (!armed) { armed = true; clearBtn.textContent = '再点一次清空'; setTimeout(function () { armed = false; clearBtn.textContent = '清空'; }, 2500); return; }
      armed = false; clearBtn.textContent = '清空';
      try { undo.push(ctx.getImageData(0, 0, S, S)); } catch (x) {}
      ctx.clearRect(0, 0, S, S); save();
    });
    var node = h('div', { 'class': 'pad-wrap' },
      h('div', { 'class': 'pad' }, guide, cv),
      h('div', { 'class': 'row' }, toolBtns, sizeBtns, undoBtn, clearBtn));
    setGuide(guideSpec); load();
    return { node: node, setKey: function (k, spec) { key = k; setGuide(spec); load(); } };
  }

  function drillPanel(pool, date) {
    pool = (pool || []).filter(function (k) { return k && k.char; });
    var single = pool.filter(function (k) { return chars(k.char).length === 1; });
    var sec = h('section', { 'class': 'panel', id: 'sec-drill' }, h('span', { 'class': 'tab hi', text: '抽假名和听写' }));
    var grid = h('div', { 'class': 'drill-grid' }); sec.appendChild(grid);
    function other(list, not) { var k; do { k = list[Math.floor(Math.random() * list.length)]; } while (list.length > 1 && k === not); return k; }
    function tally(kind, ok) {
      if (!date) return;
      var d = Object.assign({}, Store.get(date).drill || {});
      var t = Object.assign({ right: 0, total: 0 }, d[kind] || {});
      t.total++; if (ok) t.right++; d[kind] = t;
      Store.patch(date, { drill: d }, true);
    }

    /* 1. random pick: the kana flicker until she presses stop, then she reads the one it lands on */
    (function () {
      var glyph = ja('？'), ro = h('span', { 'class': 'ro' });
      var info = h('p', { 'class': 'drill-say', 'aria-live': 'polite' });
      var go = h('button', { 'class': 'btn primary', type: 'button', text: '开始' });
      var reveal = h('button', { 'class': 'btn sm', type: 'button', text: '看读音', hidden: true });
      var yes = h('button', { 'class': 'btn sm hi', type: 'button', text: '○ 读对了', hidden: true });
      var no = h('button', { 'class': 'btn sm', type: 'button', text: '× 没读对', hidden: true });
      var tm = null, cur = null, last = null, t0 = 0, right = 0, total = 0;
      function halt() { clearInterval(tm); tm = null; }
      disposers.push(halt);
      go.addEventListener('click', function () {
        if (tm) {
          halt();
          cur = last = other(pool, last);
          glyph.textContent = cur.char; t0 = Date.now();
          go.textContent = '开始'; go.disabled = true; reveal.hidden = false;
          info.textContent = '马上读出来！';
          return;
        }
        ro.textContent = ''; reveal.hidden = true; yes.hidden = true; no.hidden = true; info.textContent = '';
        go.textContent = '停！';
        tm = setInterval(function () { cur = other(pool, cur); glyph.textContent = cur.char; }, 80);
      });
      reveal.addEventListener('click', function () {
        if (!cur) return;
        ro.textContent = cur.romaji || ''; Voice.speak(cur.say || cur.char);
        info.textContent = '用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒';
        reveal.hidden = true; yes.hidden = false; no.hidden = false; go.disabled = false; go.textContent = '再抽一个';
      });
      function judge(ok) {
        total++; if (ok) right++; tally('spin', ok);
        info.textContent = '读对 ' + right + ' / ' + total;
        yes.hidden = true; no.hidden = true;
      }
      yes.addEventListener('click', function () { judge(true); });
      no.addEventListener('click', function () { judge(false); });
      grid.appendChild(h('div', { 'class': 'drill-card' },
        h('h3', { text: '抽假名' }),
        h('p', { 'class': 'muted small', text: '按“开始”，假名会飞快地跳；按“停！”抽中一个，马上大声读出来，再看读音对不对。' }),
        h('div', { 'class': 'flash sm' }, glyph, ro), info,
        h('div', { 'class': 'row' }, go, reveal, yes, no)));
    })();

    /* 2. dictation: she hears a kana and writes it from memory; strokes are checked when stroke data exists */
    if (single.length) (function () {
      var say = h('p', { 'class': 'drill-say', 'aria-live': 'polite', text: '按“听一个”开始。' });
      var pad = h('div', { 'class': 'writer' });
      var result = h('p', { 'class': 'verdict', 'aria-live': 'polite' });
      var next = h('button', { 'class': 'btn primary', type: 'button', text: '听一个' });
      var again = h('button', { 'class': 'btn sm', type: 'button', text: '再听一遍', hidden: true });
      var show = h('button', { 'class': 'btn sm', type: 'button', text: '看答案', hidden: true });
      var cur = null, last = null, writer = null, done = true, right = 0, total = 0;
      function play() {
        if (!cur) return;
        if (Voice.can(cur.say || cur.char)) { Voice.speak(cur.say || cur.char); say.textContent = writer ? '听到了吗？在格子里按笔顺写出来。' : '听到了吗？写在纸上，再看答案。'; }
        else say.textContent = '这台设备播不出日语语音，看读音写：' + (cur.romaji || '');
      }
      function finish(ok) {
        if (done || !cur) return;
        done = true; total++; if (ok) right++; tally('dict', ok);
        if (!ok) {
          if (writer) { try { writer.cancelQuiz(); writer.showCharacter(); } catch (e) {} }
          else { pad.className = 'writer plain ja'; pad.lang = 'ja'; pad.textContent = cur.char; }
        }
        result.textContent = '';
        result.appendChild(h('span', { 'class': 'mark', text: ok ? '○' : '×' }));
        result.appendChild(document.createTextNode((ok ? '写对了：' : '答案是：') + cur.char + '（' + (cur.romaji || '') + '）　写对 ' + right + ' / ' + total));
        show.hidden = true;
      }
      next.addEventListener('click', function () {
        cur = last = other(single, last); done = false;
        result.textContent = ''; pad.textContent = ''; pad.className = 'writer'; pad.removeAttribute('lang'); writer = null;
        if (window.HanziWriter && Data.strokes && Data.strokes[cur.char]) {
          try {
            writer = window.HanziWriter.create(pad, cur.char, {
              width: 168, height: 168, padding: 12, showOutline: false, showCharacter: false,
              strokeColor: INK, drawingColor: INK, highlightColor: RED, drawingWidth: 6,
              showHintAfterMisses: false, highlightOnComplete: true,
              charDataLoader: function (c, ready) { ready(Data.strokes[c]); }
            });
            writer.quiz({ onComplete: function () { finish(true); } });
          } catch (e) { writer = null; }
        }
        next.textContent = '下一个'; again.hidden = false; show.hidden = false;
        play();
      });
      again.addEventListener('click', play);
      show.addEventListener('click', function () { finish(false); });
      grid.appendChild(h('div', { 'class': 'drill-card' },
        h('h3', { text: '听写' }),
        h('p', { 'class': 'muted small', text: '听一个读音，不看字，把听到的假名写出来。笔顺和形状对了会自动判对；想不起来就按“看答案”。' }),
        say, pad, result,
        h('div', { 'class': 'row' }, next, again, show)));
    })();
    return sec;
  }

  function quizSection(lesson, date) {
    var qs = (lesson.quiz || []).filter(function (q) { return q && Array.isArray(q.options) && q.options.length > 1; });
    var sec = h('section', { 'class': 'panel', id: 'sec-quiz' }, h('span', { 'class': 'tab', text: '小测' }));
    var body = h('div', { 'class': 'stack' }); sec.appendChild(body);
    function run() {
      body.textContent = '';
      var answered = 0, score = 0, wrong = [];
      var total = h('p', { 'class': 'score', 'aria-live': 'polite' });
      qs.forEach(function (q, qi) {
        var block = h('div', { 'class': 'q' });
        block.appendChild(h('div', { 'class': 'row' }, h('span', { 'class': 'q-text', text: (qi + 1) + '. ' + q.q }), q.say ? sayBtn(q.say, '听题目里的发音') : null));
        var verdict = h('p', { 'class': 'verdict', 'aria-live': 'polite' });
        var isKana = q.options.every(function (o) { return chars(o).length <= 3 && /^[぀-ヿー]+$/.test(o); });
        var btns = q.options.map(function (o, oi) {
          var b = h('button', { 'class': 'btn opt' + (isKana ? ' kana ja' : ''), type: 'button', text: String(o) });
          if (isKana) b.lang = 'ja';
          b.addEventListener('click', function () {
            if (block.getAttribute('data-done')) return;
            block.setAttribute('data-done', '1');
            var ok = oi === q.answer;
            btns.forEach(function (x, xi) { x.disabled = true; if (xi === q.answer) x.classList.add('right'); });
            if (!ok) b.classList.add('wrong');
            verdict.textContent = '';
            verdict.appendChild(h('span', { 'class': 'mark', text: ok ? '○' : '×' }));
            verdict.appendChild(document.createTextNode((ok ? '答对了。' : '再记一下。') + (q.explain ? ' ' + q.explain : '')));
            answered++; if (ok) score++; else wrong.push(q.q);
            if (answered === qs.length) {
              total.textContent = '得分 ' + score + ' / ' + qs.length + (score === qs.length ? '　全对！' : '');
              Store.patch(date, { quiz: { score: score, total: qs.length, wrong: wrong, at: new Date().toISOString() } }, true);
              again.hidden = false;
            }
          });
          return b;
        });
        block.appendChild(h('div', { 'class': 'opts' }, btns));
        block.appendChild(verdict);
        body.appendChild(block);
      });
      var again = h('button', { 'class': 'btn sm', type: 'button', text: '再做一次', hidden: true });
      again.addEventListener('click', run);
      body.appendChild(h('div', { 'class': 'row' }, total, again));
      var prev = Store.get(date).quiz;
      if (prev && prev.total) total.textContent = '上次得分 ' + prev.score + ' / ' + prev.total;
    }
    run();
    return sec;
  }

      var learnedBtn = h('button', { 'class': 'btn sm', type: 'button', text: '学过的', disabled: true });
      var weak = weakKeys();
      var weakBtn = weak.length ? h('button', { 'class': 'btn sm', type: 'button', text: '最近错过的（' + weak.length + '）' }) : null;
      var clearBtn = h('button', { 'class': 'btn sm', type: 'button', text: '清空' });
      if (weakBtn) weakBtn.addEventListener('click', function () { replaceWith(weak); });
      clearBtn.addEventListener('click', function () { sel = {}; changed(); });

      var pickSec = h('section', { 'class': 'panel' },
        h('div', { 'class': 'row spread' }, h('span', { 'class': 'tab', text: '选假名' }), total),
        h('div', { 'class': 'row' }, learnedBtn, weakBtn, clearBtn),
        h('p', { 'class': 'muted small', text: '点一个假名单独选它；点“あ行”这样的行名选一整行；点“全选”选一整组。黄色的是选中的。' }));
      var anyPicked = picked().length > 0;
      KANA.sections.forEach(function (sc) {
        pickSec.appendChild(h('h2', { text: sc.name }));
        sc.groups.forEach(function (g, gi) {
          var items = [];
          g.rows.forEach(function (r) { r.cells.forEach(function (c) { if (c) items.push(c); }); });
          var count = h('span', { 'class': 'pick-count' });
          var allBtn = h('button', { 'class': 'btn sm', type: 'button' });
          var body = h('div', { 'class': 'pick-rows' + (g.three ? ' three' : '') });
          var toggle = h('button', { 'class': 'pick-toggle', type: 'button', 'aria-expanded': 'false' },
            h('span', { text: g.name }), g.en ? h('span', { 'class': 'muted small', text: g.en }) : null);
          function setOpen(open) { body.hidden = !open; toggle.setAttribute('aria-expanded', open ? 'true' : 'false'); }
          function hasPicked() { return items.some(function (c) { return sel[c.k]; }); }
          openers[g.id] = function () { if (hasPicked()) setOpen(true); };
          toggle.addEventListener('click', function () { setOpen(body.hidden); });
          allBtn.addEventListener('click', function () {
            var full = items.every(function (c) { return sel[c.k]; });
            items.forEach(function (c) { sel[c.k] = full ? 0 : 1; });
            if (!full) setOpen(true);
            changed();
          });
          g.rows.forEach(function (r) {
            var cells = r.cells.filter(function (c) { return c; });
            var rowBtn = h('button', { 'class': 'krow ja', type: 'button', lang: 'ja', text: r.label, 'aria-pressed': 'false', 'aria-label': r.label + ' 整行' });
            rowBtn.addEventListener('click', function () {
              var full = cells.every(function (c) { return sel[c.k]; });
              cells.forEach(function (c) { sel[c.k] = full ? 0 : 1; });
              changed();
            });
            var row = h('div', { 'class': 'pick-row' }, rowBtn);
            r.cells.forEach(function (c) {
              if (!c) { row.appendChild(h('span', { 'class': 'kpick gap', 'aria-hidden': 'true' })); return; }
              var b = h('button', { 'class': 'kpick ja' + (chars(c.k).length > 1 ? ' two' : ''), type: 'button', lang: 'ja', text: c.k, title: c.ro, 'aria-pressed': 'false' });
              b.addEventListener('click', function () { sel[c.k] = sel[c.k] ? 0 : 1; changed(); });
              painters.push(function () { var on = !!sel[c.k]; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
              row.appendChild(b);
            });
            painters.push(function () { var full = cells.every(function (c) { return sel[c.k]; }); rowBtn.classList.toggle('on', full); rowBtn.setAttribute('aria-pressed', full ? 'true' : 'false'); });
            body.appendChild(row);
          });
          painters.push(function () {
            var n = items.filter(function (c) { return sel[c.k]; }).length;
            count.textContent = n + ' / ' + items.length;
            allBtn.textContent = n === items.length ? '取消全选' : '全选';
          });
          setOpen(anyPicked ? hasPicked() : (sc.script === 'hira' && gi === 0));
          pickSec.appendChild(h('div', { 'class': 'pick' }, h('div', { 'class': 'pick-head' }, toggle, count, allBtn), body));
        });
      });
      holder.appendChild(pickSec);

      holder.appendChild(h('section', { 'class': 'panel pop' },
        h('span', { 'class': 'tab hi', text: '怎么考' }),
        h('div', { 'class': 'row' }, h('span', { 'class': 'step-title', text: '题型' }),
          seg([['mix', '读和写随机出'], ['read', '只读'], ['write', '只写']], st.mode, function (v) { st.mode = v; TestState.save(); })),
        h('div', { 'class': 'row' }, h('span', { 'class': 'step-title', text: '题数' }),
          seg([[10, '10 题'], [20, '20 题'], [30, '30 题'], [0, '每个假名一遍']], st.count, function (v) { st.count = v; TestState.save(); }))));
      /* the start button stays at the bottom of the screen while she scrolls through the kana */
      holder.appendChild(h('div', { 'class': 'startbar' }, start));
      start.addEventListener('click', function () {
        var items = picked(); if (!items.length) return;
        start.disabled = true;
        loadStrokes().then(function () { if (live && scr === id) run(items); });
      });
      paint();

      /* "learned so far" comes from the lessons up to today plus any finished ahead; on the very first visit it is preselected */
      var ls = Data.manifest ? learnedLessons() : [];
      Promise.all(ls.map(function (l) { return loadLesson(l.date).catch(function () { return null; }); })).then(function (all) {
        if (!live || scr !== id) return;
        var seen = {};
        all.forEach(function (l) { if (l) (l.kana || []).forEach(function (k) { if (k && KANA.byKey[k.char]) seen[k.char] = 1; }); });
        var learned = Object.keys(seen);
        if (!learned.length) return;
        learnedBtn.disabled = false; learnedBtn.textContent = '学过的（' + learned.length + '）';
        learnedBtn.addEventListener('click', function () { replaceWith(learned); });
        if (TestState.fresh && !picked().length) { TestState.fresh = false; replaceWith(learned); }
      });
    }

    /* ----- screen 2: the questions ----- */
    function run(items, howMany) {
      var id = ++scr;
      var modes = st.mode === 'mix' ? ['read', 'write'] : [st.mode];
      var n = howMany || st.count || items.length;
      var queue = [], bag = [], i;
      for (i = 0; i < n; i++) {
        if (!bag.length) {
          bag = shuffle(items);
          if (queue.length && bag.length > 1 && bag[0] === queue[queue.length - 1].it) bag.push(bag.shift());
        }
        queue.push({ it: bag.shift(), mode: modes[i % modes.length] });
      }
      var mixed = shuffle(queue.map(function (q) { return q.mode; }));
      queue.forEach(function (q, j) { q.mode = mixed[j]; });

      var qi = -1, log = [];
      Voice.prime(items.map(function (it) { return it.say; }));
      var prog = h('span', { 'class': 'clock' }), score = h('span', { 'class': 'clock' });
      var quit = h('button', { 'class': 'btn sm', type: 'button', text: '结束' });
      var stage = h('div', { 'class': 'stack' });
      holder.textContent = '';
      holder.appendChild(h('h1', { text: '假名测试' }));
      holder.appendChild(h('section', { 'class': 'panel pop' },
        h('div', { 'class': 'test-top' }, prog, score, quit), stage,
        h('p', { 'class': 'muted small keys', text: '键盘：空格 = 看答案 / 下一题，→ 对了，← 没对。' })));
      quit.addEventListener('click', function () { if (scr === id) result(); });

      function record(q, ok, secs) {
        log.push({ it: q.it, mode: q.mode, ok: ok, secs: secs });
        var hist = (st.hist[q.it.k] || []).concat(ok ? 1 : 0);
        st.hist[q.it.k] = hist.slice(-5); TestState.save();
      }
      function next() {
        if (!live || scr !== id) return;
        qi++;
        if (qi >= queue.length) { result(); return; }
        prog.textContent = '第 ' + (qi + 1) + ' / ' + queue.length + ' 题';
        score.textContent = '对 ' + log.filter(function (r) { return r.ok; }).length + ' / ' + log.length;
        stage.textContent = ''; onKey = null; Voice.stop();
        if (queue[qi].mode === 'read') askRead(queue[qi]); else askWrite(queue[qi]);
      }

      /* see the kana, say it at once, then check against the reading */
      function askRead(q) {
        var it = q.it, t0 = Date.now(), shown = false, judged = false, secs = 0;
        var ro = h('span', { 'class': 'ro' });
        var info = h('p', { 'class': 'drill-say', 'aria-live': 'polite', text: '马上大声读出来！' });
        var reveal = h('button', { 'class': 'btn primary', type: 'button', text: '看答案' });
        var yes = h('button', { 'class': 'btn hi', type: 'button', text: '○ 读对了', hidden: true });
        var no = h('button', { 'class': 'btn', type: 'button', text: '× 没读对', hidden: true });
        function show() {
          if (shown) return;
          shown = true; secs = (Date.now() - t0) / 1000;
          ro.textContent = it.ro; Voice.speak(it.say);
          info.textContent = '用时 ' + secs.toFixed(1) + ' 秒。读对了吗？';
          reveal.hidden = true; yes.hidden = false; no.hidden = false;
        }
        function judge(ok) { if (!shown || judged) return; judged = true; record(q, ok, secs); next(); }
        reveal.addEventListener('click', show);
        yes.addEventListener('click', function () { judge(true); });
        no.addEventListener('click', function () { judge(false); });
        onKey = function (key) {
          if (!shown) { if (key === ' ' || key === 'Enter') { show(); return true; } return false; }
          if (key === 'ArrowRight') { judge(true); return true; }
          if (key === 'ArrowLeft') { judge(false); return true; }
          return false;
        };
        stage.appendChild(h('div', { 'class': 'row center' }, h('span', { 'class': 'chip kind-new', text: '看字 · 读出来' })));
        stage.appendChild(h('div', { 'class': 'flash' + (chars(it.k).length > 1 ? ' two' : '') }, ja(it.k), ro));
        stage.appendChild(info);
        stage.appendChild(h('div', { 'class': 'row center' }, reveal, yes, no));
      }

      /* hear the reading, write the kana from memory; stroke order and shape are checked box by box */
      function askWrite(q) {
        var it = q.it, cs = chars(it.k), t0 = Date.now(), done = false, shown = false, mistakes = 0;
        var say = h('p', { 'class': 'drill-say', 'aria-live': 'polite' });
        var result = h('p', { 'class': 'verdict', 'aria-live': 'polite', style: 'text-align:center' });
        var again = h('button', { 'class': 'btn sm', type: 'button', text: '再听一遍' });
        var show = h('button', { 'class': 'btn', type: 'button', text: '看答案' });
        var yes = h('button', { 'class': 'btn hi', type: 'button', text: '○ 写对了', hidden: true });
        var no = h('button', { 'class': 'btn', type: 'button', text: '× 没写对', hidden: true });
        var nextBtn = h('button', { 'class': 'btn primary', type: 'button', text: '下一题', hidden: true });
        var boxes = cs.map(function (c, bi) { return h('div', { 'class': 'writer' + (bi ? ' small idle' : '') }); });
        var writers = [], canCheck = true;
        cs.forEach(function (c, bi) {
          var w = null, size = bi ? 120 : 168;
          if (window.HanziWriter && Data.strokes && Data.strokes[c]) {
            try {
              w = window.HanziWriter.create(boxes[bi], c, {
                width: size, height: size, padding: bi ? 8 : 12, showOutline: false, showCharacter: false,
                strokeColor: INK, drawingColor: INK, highlightColor: RED, drawingWidth: 6,
                showHintAfterMisses: false, highlightOnComplete: true,
                charDataLoader: function (ch, ready) { ready(Data.strokes[ch]); }
              });
            } catch (e) { w = null; }
          }
          if (!w) canCheck = false;
          writers.push(w);
        });
        if (!canCheck) boxes.forEach(function (b, bi) { b.textContent = ''; b.className = 'writer plain ja' + (bi ? ' small' : ''); b.lang = 'ja'; });
        function label() { return it.k + '（' + it.ro + '）'; }
        function mark(sym, text) { result.textContent = ''; result.appendChild(h('span', { 'class': 'mark', text: sym })); result.appendChild(document.createTextNode(text)); }
        function play() {
          if (Voice.can(it.say)) { Voice.speak(it.say); say.textContent = canCheck ? '听到了吗？按笔顺写在格子里。' : '听到了吗？写在纸上，再看答案。'; }
          else { again.hidden = true; say.textContent = '这台设备播不出日语语音，看读音写：' + it.ro; }
        }
        function quizAt(bi) {
          boxes[bi].classList.remove('idle');
          writers[bi].quiz({ onComplete: function (sum) {
            mistakes += (sum && sum.totalMistakes) || 0;
            if (bi + 1 < writers.length) quizAt(bi + 1); else complete();
          } });
        }
        function complete() {
          if (done) return; done = true;
          var secs = (Date.now() - t0) / 1000, ok = mistakes <= 2 * cs.length;
          record(q, ok, secs);
          again.hidden = true; show.hidden = true;
          if (ok) { mark('○', '写对了：' + label() + '　用时 ' + secs.toFixed(1) + ' 秒'); later(next, 1100); }
          else { mark('△', '写出来了，不过中间错了 ' + mistakes + ' 笔，算还没记牢：' + label()); nextBtn.hidden = false; }
        }
        function reveal() {
          if (done || shown) return; shown = true;
          if (canCheck) {
            writers.forEach(function (w, bi) { boxes[bi].classList.remove('idle'); try { w.cancelQuiz(); w.showCharacter(); } catch (e) {} });
            done = true; record(q, false, (Date.now() - t0) / 1000);
            mark('×', '答案是：' + label());
            again.hidden = true; show.hidden = true; nextBtn.hidden = false;
          } else {
            boxes.forEach(function (b, bi) { b.textContent = cs[bi]; });
            mark('', '答案是：' + label() + '。写对了吗？');
            again.hidden = true; show.hidden = true; yes.hidden = false; no.hidden = false;
          }
        }
        function selfJudge(ok) { if (done) return; done = true; record(q, ok, (Date.now() - t0) / 1000); next(); }
        again.addEventListener('click', play);
        show.addEventListener('click', reveal);
        yes.addEventListener('click', function () { selfJudge(true); });
        no.addEventListener('click', function () { selfJudge(false); });
        nextBtn.addEventListener('click', next);
        onKey = function (key) {
          if (!nextBtn.hidden && (key === ' ' || key === 'Enter')) { next(); return true; }
          if (!yes.hidden && key === 'ArrowRight') { selfJudge(true); return true; }
          if (!no.hidden && key === 'ArrowLeft') { selfJudge(false); return true; }
          return false;
        };
        stage.appendChild(h('div', { 'class': 'row center' },
          h('span', { 'class': 'chip kind-manga', text: '听音 · 写出来' }),
          h('span', { 'class': 'chip', text: it.script === 'hira' ? '写平假名' : '写片假名' })));
        stage.appendChild(say);
        var tw = KANA.twin[it.k];
        if (tw && (KANA.rare[it.k] || sel[tw])) stage.appendChild(h('p', { 'class': 'muted small', style: 'text-align:center' }, '有两个假名读这个音，这次写 ', ja(KANA.rowName[it.k]), ' 的那个。'));
        stage.appendChild(h('div', { 'class': 'wr-row' }, boxes));
        stage.appendChild(result);
        stage.appendChild(h('div', { 'class': 'row center' }, again, show, yes, no, nextBtn));
        if (canCheck) quizAt(0);
        play();
      }

      /* ----- screen 3: what went well, what to practise again ----- */
      function result() {
        scr++; onKey = null; Voice.stop();
        var right = log.filter(function (r) { return r.ok; }).length;
        var reads = log.filter(function (r) { return r.mode === 'read'; }), writes = log.filter(function (r) { return r.mode === 'write'; });
        function uniq(list) { var seen = {}, out = []; list.forEach(function (r) { if (!seen[r.it.k]) { seen[r.it.k] = 1; out.push(r.it); } }); return out; }
        var missed = uniq(log.filter(function (r) { return !r.ok; }));
        var missedKeys = {}; missed.forEach(function (it) { missedKeys[it.k] = 1; });
        var slow = uniq(reads.filter(function (r) { return r.ok && r.secs > 3; })).filter(function (it) { return !missedKeys[it.k]; });
        var sec = h('section', { 'class': 'panel pop' }, h('span', { 'class': 'tab hi', text: '结果' }));
        holder.textContent = '';
        holder.appendChild(h('h1', { text: '假名测试' }));
        holder.appendChild(sec);
        if (!log.length) sec.appendChild(h('p', { text: '这次还没有答题。' }));
        else {
          sec.appendChild(h('p', { 'class': 'score', text: log.length + ' 题里对了 ' + right + ' 题' }));
          if (reads.length) {
            var okReads = reads.filter(function (r) { return r.ok; });
            var avg = okReads.length ? okReads.reduce(function (s, r) { return s + r.secs; }, 0) / okReads.length : 0;
            sec.appendChild(h('p', { text: '看字读：' + reads.length + ' 题对 ' + okReads.length + ' 题' + (okReads.length ? '，读对的平均用时 ' + avg.toFixed(1) + ' 秒' : '') + '。' }));
          }
          if (writes.length) sec.appendChild(h('p', { text: '听音写：' + writes.length + ' 题对 ' + writes.filter(function (r) { return r.ok; }).length + ' 题。' }));
          if (missed.length) {
            sec.appendChild(h('p', { 'class': 'step-title', text: '要再练的：' }));
            sec.appendChild(ja(missed.map(function (it) { return it.k; }).join(' '), 'missed', 'p'));
          }
          if (slow.length) {
            sec.appendChild(h('p', { 'class': 'step-title', text: '读对了，但想了 3 秒以上的：' }));
            sec.appendChild(ja(slow.map(function (it) { return it.k; }).join(' '), 'missed', 'p'));
          }
          if (!missed.length && qi >= queue.length) sec.appendChild(h('div', { 'class': 'stamp-wrap' }, hanamaru(72, true), ja('よくできました！')));
        }
        var btns = h('div', { 'class': 'row' });
        if (missed.length) {
          var redo = h('button', { 'class': 'btn hi', type: 'button', text: '只练要再练的（' + missed.length + ' 个）' });
          redo.addEventListener('click', function () { run(missed, missed.length * 2); });
          btns.appendChild(redo);
        }
        var againBtn = h('button', { 'class': 'btn', type: 'button', text: '同样的假名再来一次' });
        againBtn.addEventListener('click', function () { run(items, howMany); });
        var back = h('button', { 'class': 'btn', type: 'button', text: '重新选假名' });
        back.addEventListener('click', setup);
        btns.appendChild(againBtn); btns.appendChild(back);
        sec.appendChild(btns);
        window.scrollTo(0, 0);
      }

      next();
      window.scrollTo(0, 0);
    }

    loadStrokes();
    setup();
  }

  /* ---------- router ---------- */
  var offStore = null, disposers = [];
  function setNav(name) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
      if (a.getAttribute('data-nav') === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function render() {
    clearInterval(reviewTimer);
    disposers.forEach(function (f) { try { f(); } catch (e) {} }); disposers = [];
    if (offStore) { offStore(); offStore = null; }
    var name = currentRoute(), m = /^d-(\d{4}-\d{2}-\d{2})$/.exec(name);
    app.textContent = '';
    if (m) { setNav(''); viewLesson(m[1]); }
    else if (name === 'all') { setNav('all'); viewAll(); offStore = Store.onChange(render); }
    else if (name === 'review') { setNav('review'); viewReview(); }
    else if (name === 'test') { setNav('test'); viewTest(); }
    else { setNav('home'); viewHome(); offStore = Store.onChange(render); }
  }
  function route() {
    var name = currentRoute();
    var isList = !/^d-/.test(name) && name !== 'review' && name !== 'test';
    if (isList && Date.now() - Data.loadedAt > 120000) {
      loadManifest().catch(function () {}).then(function () { render(); window.scrollTo(0, 0); });
      return;
    }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  var clipsReady = Promise.race([Clips.load(), new Promise(function (ok) { setTimeout(ok, 2500); })]);
  Clips.load().then(function () { Voice.refresh(); });
  Promise.all([loadManifest(), clipsReady]).then(route).catch(function () {
    app.textContent = '';
    var retry = h('button', { 'class': 'btn', type: 'button', text: '重新加载' });
    retry.addEventListener('click', function () { loadManifest().then(route).catch(function () {}); });
    app.appendChild(h('section', { 'class': 'panel' }, h('h2', { text: '课程目录没有加载出来' }), h('p', { 'class': 'muted', text: '检查一下网络，然后再试一次。' }), h('div', { 'class': 'row' }, retry)));
  });
})();
</script>
</body>
